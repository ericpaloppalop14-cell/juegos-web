<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8"><title>Mochi Olimpiadas</title>
<link rel="icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json">
<style>
@font-face{font-family:'Fredoka';src:url(fredoka.woff2) format('woff2');font-weight:300 700;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe9d6;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;inset:0;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:#7a4b8a}
canvas{position:absolute;inset:0;display:block;touch-action:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);background:rgba(255,233,214,.55);backdrop-filter:blur(2px)}
.scr.on{display:flex}
h1{margin:0;font-size:46px;line-height:1;color:#fff;text-align:center;text-shadow:0 3px 0 #e58bb5,2px 2px 0 #e58bb5,-2px 2px 0 #e58bb5,2px -1px 0 #e58bb5,-2px -1px 0 #e58bb5,0 6px 14px rgba(160,80,140,.35)}
h1 small{display:block;font-size:24px;margin-top:4px}
.rings{font-size:26px;letter-spacing:2px;margin:6px 0 12px}
.btn{font-family:inherit;border:0;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(180deg,#ffa9cf,#f37fb4);padding:12px 26px;border-radius:40px;box-shadow:0 5px 0 #d0609a,0 10px 18px rgba(200,90,150,.3);margin:6px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d0609a}
.btn.alt{background:linear-gradient(180deg,#cdb8ff,#a98cf0);box-shadow:0 5px 0 #8065c8}
.list{display:flex;flex-direction:column;gap:8px;width:min(360px,92vw);margin:8px 0}
.ev{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:22px;padding:9px 14px;box-shadow:0 5px 0 rgba(200,140,210,.45);font-size:19px;font-weight:600;cursor:pointer;border:0;font-family:inherit;color:#7a4b8a;text-align:left}
.ev .ic{font-size:26px;width:34px;text-align:center}.ev .nm{flex:1}.ev .md{font-size:24px}
.card{background:rgba(255,255,255,.94);border-radius:30px;padding:20px 26px;min-width:260px;max-width:92vw;text-align:center;box-shadow:0 8px 0 rgba(200,140,210,.45),0 20px 40px rgba(150,80,150,.25);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.card h2{margin:0 0 4px;font-size:32px;color:#f27bb2}
.big{font-size:44px;font-weight:700;color:#a374c4}.medal{font-size:64px;line-height:1.1}
.sub{font-size:17px;opacity:.85;margin:4px 0}
table{margin:8px auto;border-collapse:collapse;font-size:17px}td{padding:4px 8px}
#intro .how{font-size:18px;max-width:300px;margin:8px auto}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu" class="scr on">
 <h1>Mochi<small>Olimpiadas</small></h1><div class="rings">🔵🟡⚫🟢🔴</div>
 <button class="btn" id="bAll">¡Jugar Olimpiada!</button>
 <div class="list" id="evList"></div>
 <button class="btn alt" id="bMed">🏅 Medallero</button>
</div>
<div id="intro" class="scr"><div class="card"><h2 id="inT"></h2><div class="how" id="inH"></div><button class="btn" id="inGo">¡Vamos!</button></div></div>
<div id="res" class="scr"><div class="card"><h2 id="rsT"></h2><div class="medal" id="rsM"></div><div class="big" id="rsS"></div><div class="sub" id="rsR"></div><div class="sub" id="rsN"></div>
 <div><button class="btn alt" id="rsAgain">Repetir</button><button class="btn" id="rsNext">Seguir</button></div></div></div>
<div id="medals" class="scr"><div class="card"><h2 id="mdT">Medallero</h2><div class="medal" id="mdTot"></div><table id="mdTab"></table><button class="btn" id="mdBack">Menú</button></div></div>
<script src="game.js"></script>
</body></html>
