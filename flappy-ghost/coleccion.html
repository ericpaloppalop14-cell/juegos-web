<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Ghost · Crystal</title><link rel="stylesheet" href="experience.css"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#493763,#191628 75%);color:#fff1e3;font-family:Nunito,system-ui,sans-serif;min-height:100vh;padding:24px 20px 60px}main{max-width:1050px;margin:auto}a{color:#e9d2ad;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}header{margin:30px 0;text-align:center}small{letter-spacing:.16em;text-transform:uppercase;color:#d2b88b;font-size:11px}h1{font-family:Fredoka,Georgia,serif;font-size:clamp(32px,6vw,58px);margin:14px 0}header p{color:#c6bbd4;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card{border:1px solid #bba08040;border-radius:22px;padding:12px 10px 23px;text-align:center;background:linear-gradient(160deg,#ffffff0d,#ffffff02)}canvas{display:block;width:100%;aspect-ratio:1}h2{font-family:Fredoka,Georgia,serif;margin:4px 0 8px;font-size:24px}.card p{color:#bdb1cf;font-size:12px;min-height:32px}.tag{display:inline-block;border:1px solid #d6b87550;border-radius:30px;padding:7px 12px;color:#e8d0a8;font-size:11px}.back{display:flex;width:max-content;margin:34px auto 0;border:1px solid #cab07f;border-radius:30px;padding:13px 24px}.note{text-align:center;color:#a79ab9;font-size:13px;margin-top:20px}select{float:right;min-height:44px;background:#fff6e8;color:#493763;border:0;border-radius:12px;padding:8px}a:focus-visible,select:focus-visible{outline:3px solid #fff6e8;outline-offset:4px}
</style></head><body><main><select id="language"><option value="es">Español</option><option value="en">English</option></select><a href="index.html" data-text="backGame"></a><header><small data-text="collectionNew"></small><h1 data-text="collectionTitle"></h1><p data-text="collectionIntro"></p></header><div class="grid" id="cards"></div><a class="back" href="index.html" data-text="backGame"></a><p class="note" data-text="collectionNote"></p></main><script src="i18n.js"></script><script src="products.js"></script><script src="bridge.js"></script><script src="crystal-ghosts.js"></script><script>
(async()=>{const ids=['prisma','aurora','noctis','rubi','helios'],entries=[];const t=(key)=>FG_I18N.text(key);
for(let i=0;i<ids.length;i++){const card=document.createElement('article');card.className='card';card.innerHTML='<canvas width="384" height="384"></canvas><h2 data-text="'+ids[i]+'"></h2><p data-text="'+ids[i]+'Description"></p><span class="tag"></span>';document.getElementById('cards').append(card);const im=new Image();im.src='game/chars/'+(12+i)+'.png';try{await im.decode();}catch{}entries.push({ctx:card.querySelector('canvas').getContext('2d'),im,index:12+i,id:ids[i],tag:card.querySelector('.tag')});}
const select=document.getElementById('language');FG_I18N.populateLanguagePicker(select);select.onchange=()=>FG_I18N.setLanguage(select.value);
function translate(){document.querySelectorAll('[data-text]').forEach(e=>e.textContent=t(e.dataset.text));select.value=FG_I18N.language();select.setAttribute('aria-label',t('language'));document.title=t('collectionTitle')+' · Flappy Ghost';entries.forEach(e=>e.tag.textContent=NativeBridge.price('skin_'+e.id)||t('exclusivePurchase'));}window.addEventListener('ghost-language-changed',translate);translate();NativeBridge.ready.then(translate);
await CrystalGhosts.prepare();const reduced=matchMedia('(prefers-reduced-motion: reduce)');let raf=0;function draw(now){for(const {ctx,im,index} of entries){ctx.clearRect(0,0,384,384);ctx.save();ctx.translate(192,192);ctx.scale(3.55,3.55);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-48,-48,96,96);CrystalGhosts.draw(ctx,index,reduced.matches?0:now/1000);ctx.restore();}if(!reduced.matches&&!document.hidden)raf=requestAnimationFrame(draw);}requestAnimationFrame(draw);reduced.addEventListener('change',()=>{cancelAnimationFrame(raf);requestAnimationFrame(draw);});document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)requestAnimationFrame(draw);});window.addEventListener('ghost-native-back',event=>{event.preventDefault();location.href='index.html';});
})();
</script></body></html>
