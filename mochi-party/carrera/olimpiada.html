<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd6ec">
<title>Mochi Party · Olimpiadas</title><link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Fredoka;src:url(fredoka.woff2) format('woff2');font-weight:300 700;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd6ec;font-family:Fredoka,system-ui,sans-serif;color:#6a4b8a;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#hTop{position:absolute;left:0;right:0;top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;padding:0 10px}
#hPos{font-size:52px;font-weight:700;color:#fff;-webkit-text-stroke:3px #e0609f;text-shadow:0 4px 0 #e0609f;line-height:1;background:radial-gradient(circle,#ffffffcc,#ffd6eccc);border-radius:20px;padding:3px 12px 5px;border:3px solid #fff;box-shadow:0 4px 14px rgba(160,50,120,.35);min-width:92px;text-align:center}
#hPos small{font-size:20px;-webkit-text-stroke:1.5px #e0609f}
#hPos.p1{-webkit-text-stroke-color:#d49a00;text-shadow:0 4px 0 #d49a00}
#hLap{font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 0 #b0508a,0 0 10px rgba(150,40,110,.4);text-align:center;line-height:1.1;margin-top:4px;flex:1}
#hLap span{display:block;font-size:15px}
#hBar{width:150px;height:12px;margin:6px auto 0;border-radius:8px;background:rgba(255,255,255,.35);border:2px solid #fff;overflow:hidden}#hBar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff8fc0);border-radius:6px}
#hIcon{width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.78);border:4px solid #fff;box-shadow:0 4px 0 rgba(200,100,170,.4);display:flex;align-items:center;justify-content:center;font-size:40px}
#hBoard{position:absolute;left:10px;top:calc(84px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px}
#hBoard div{font-size:12.5px;font-weight:700;color:#fff;background:rgba(110,60,150,.45);border-radius:10px;padding:2px 8px 2px 4px;display:flex;align-items:center;gap:5px;white-space:nowrap}
#hBoard div.me{background:rgba(240,96,159,.85)}
#hBoard i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #fff}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:26px;font-weight:700;color:#fff;-webkit-text-stroke:1.5px #c0508a;text-shadow:0 3px 0 #c0508a;text-align:center;width:94vw;opacity:0;transition:opacity .2s;line-height:1.1}
#count{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(1);font-size:110px;font-weight:700;color:#fff;-webkit-text-stroke:4px #e0609f;text-shadow:0 7px 0 #e0609f;opacity:0;white-space:nowrap}
#count.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(1.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:700;color:#fff;text-shadow:0 4px 0 #c0508a,0 0 24px #ff7fe0;opacity:0;transform:scale(.6);transition:all .3s cubic-bezier(.3,1.6,.5,1);padding:0 10px}
#banner.on{opacity:1;transform:scale(1)}
#say{position:absolute;left:10px;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#say div{background:rgba(255,255,255,.92);border-radius:16px;padding:6px 12px;font-size:14px;font-weight:600;color:#6a3f9a;box-shadow:0 3px 0 rgba(170,110,200,.3);animation:sayin .3s ease-out}
@keyframes sayin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);padding:7px 14px;border-radius:16px;font-weight:600;font-size:15px;text-align:center;width:max-content;max-width:92vw;transition:opacity .5s}
#ctl{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
#ctl.on{display:flex}
#ctl button{pointer-events:auto;width:96px;height:96px;border-radius:50%;border:4px solid rgba(255,255,255,.9);background:rgba(255,255,255,.35);font:700 34px Fredoka;color:#fff;text-shadow:0 2px 0 #c0508a;box-shadow:0 4px 14px rgba(160,50,120,.3)}
#ctl button.mid{width:84px;height:84px;font-size:30px;align-self:flex-end;background:rgba(126,227,196,.55)}
#ctl button:active{transform:scale(.92);background:rgba(255,255,255,.6)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .25s}
#load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#c0508a;background:#ffd6ec}
#exitB{position:absolute;right:calc(10px);bottom:calc(10px + env(safe-area-inset-bottom));pointer-events:auto;border:none;border-radius:14px;background:rgba(255,255,255,.7);font:700 13px Fredoka;color:#8b5cc2;padding:6px 10px;display:none}

/* ---- pulido v3: bordes, sombras y radios coherentes ---- */
#hPos,#hIcon{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hPos{border-radius:22px;box-shadow:0 6px 16px rgba(160,50,120,.3),inset 0 2px 0 #fff,inset 0 -3px 0 rgba(224,96,159,.18)}
#hIcon{border-radius:22px;background:linear-gradient(#fff,#ffeef8);box-shadow:0 6px 16px rgba(160,50,120,.28),inset 0 -3px 0 rgba(200,100,170,.2)}
#hBar{height:14px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(150,40,110,.3),inset 0 2px 3px rgba(120,40,100,.2)}
#hBar b{box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
#hBoard div{background:linear-gradient(rgba(120,70,160,.62),rgba(95,50,135,.62));border:1.5px solid rgba(255,255,255,.55);border-radius:12px;padding:2px 9px 2px 5px;box-shadow:0 2px 6px rgba(70,30,100,.22)}
#hBoard div.me{background:linear-gradient(#ff7fb6,#ea5a98);border-color:#fff}
#perf{border:1.5px solid rgba(255,255,255,.6)!important;border-radius:14px!important;box-shadow:0 3px 10px rgba(70,30,100,.25);background:linear-gradient(rgba(120,70,160,.66),rgba(95,50,135,.66))!important}
#hint{border:2px solid #fff;border-radius:18px;background:linear-gradient(rgba(255,255,255,.96),rgba(255,240,250,.94));box-shadow:0 6px 18px rgba(150,60,140,.22);color:#6a3f9a;line-height:1.25}
#say div{border:1.5px solid #fff;box-shadow:0 4px 12px rgba(150,60,140,.2)}
#ctl button{box-shadow:0 6px 0 rgba(150,60,130,.28),0 10px 22px rgba(160,50,120,.3),inset 0 3px 0 rgba(255,255,255,.45)}
#toast{text-shadow:0 3px 0 #c0508a,0 0 14px rgba(255,255,255,.5)}
#load{background:radial-gradient(circle at 50% 40%,#fff3fa,#ffd6ec 70%);text-shadow:0 2px 0 #fff}
#exitB{border:1.5px solid #fff;box-shadow:0 3px 8px rgba(150,60,140,.2)}

/* ---- OLIMPIADAS ---- */
#pres{position:absolute;left:50%;top:16%;transform:translate(-50%,-30px) scale(.7);opacity:0;transition:all .45s cubic-bezier(.3,1.5,.5,1);text-align:center;background:linear-gradient(#fff,#ffeef8);border:4px solid #fff;border-radius:28px;padding:10px 26px 14px;box-shadow:0 10px 30px rgba(120,40,110,.35);min-width:240px}
#pres.on{opacity:1;transform:translate(-50%,0) scale(1)}
#pres .pIc{font-size:52px;line-height:1.1;animation:bob 1s ease-in-out infinite}
#pres .pNm{font-size:28px;font-weight:700;color:#e0609f;line-height:1.1}
#pres .pOl{font-size:14px;font-weight:600;color:#8b5cc2;margin-top:4px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18);display:none;pointer-events:none}
#stick b{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffb6d9);box-shadow:0 4px 10px rgba(120,40,110,.4)}
#meter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:min(86vw,420px);height:34px;border-radius:18px;background:linear-gradient(90deg,#ff8a9a,#ffd0a0 30%,#ffd0a0 70%,#ff8a9a);border:4px solid #fff;box-shadow:0 6px 16px rgba(120,40,110,.35);display:none;transition:opacity .3s}
#meter .mz{position:absolute;top:0;bottom:0;background:#7ee3a4}#meter .mz2{position:absolute;top:0;bottom:0;background:#ffe27a;box-shadow:0 0 12px #ffe27a}
#meter i{position:absolute;top:-10px;width:8px;height:46px;margin-left:-4px;border-radius:4px;background:#6a3f9a;border:2px solid #fff}
#meter b{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:17px;color:#fff;text-shadow:0 2px 0 #c0508a}
#meter span{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:14px;font-weight:700;color:#fff;text-shadow:0 2px 0 #8b5cc2}
#rank{position:fixed;inset:0;z-index:8;display:none;align-items:flex-end;justify-content:center;padding:10px 10px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
#rank .rk{pointer-events:auto;width:min(96vw,460px);max-height:64vh;overflow:auto;background:linear-gradient(rgba(255,255,255,.96),rgba(255,240,250,.96));border:4px solid #fff;border-radius:26px;box-shadow:0 14px 40px rgba(90,30,90,.35);padding:12px 14px;animation:rkin .5s cubic-bezier(.3,1.4,.5,1)}
@media (orientation:landscape) and (max-height:500px){#rank{justify-content:flex-end;align-items:center;padding:6px 10px}#rank .rk{width:min(50vw,440px);max-height:96vh;padding:8px 12px}#rank h3{font-size:18px}.rkSub{margin:0 0 3px;font-size:12px}.rkTabs{margin-bottom:3px}.rkList{gap:3px}.row{padding:2px 9px;font-size:14px}.row .ps{font-size:16px}.rkBtns{margin-top:6px}.btn{padding:8px 10px;font-size:15px}}
@keyframes rkin{0%{transform:translateY(60px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
#rank h3{margin:0;font-size:22px;color:#e0609f;text-align:center;line-height:1.15}
.rkSub{text-align:center;font-size:13px;font-weight:600;color:#8b5cc2;margin:2px 0 6px}
.rkTabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.rkTabs b{font-size:13px;padding:4px 12px;border-radius:12px;background:#f3e6fb;color:#8b5cc2;cursor:pointer}.rkTabs b.on{background:#e0609f;color:#fff}
.rkList{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 10px;font-weight:700;color:#6a3f9a;box-shadow:0 3px 0 rgba(170,110,200,.25);opacity:0;animation:rowin .45s cubic-bezier(.3,1.5,.5,1) forwards}
.row.me{background:linear-gradient(90deg,#ffe0ef,#fff);outline:3px solid #f0609f}
@keyframes rowin{0%{opacity:0;transform:translateX(-40px) scale(.9)}100%{opacity:1;transform:none}}
.row .ps{width:34px;font-size:20px;text-align:center}.row i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #c9b2ff}.row .nm{flex:1}.row .rs{font-size:13px;color:#9a72c8}
.row .pt{background:#ffd84a;color:#8a5a00;border-radius:10px;padding:1px 7px;font-size:13px;opacity:0;animation:ptin .4s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes ptin{0%{opacity:0;transform:scale(2)}100%{opacity:1;transform:none}}
.row .tt{min-width:34px;text-align:right;color:#e0609f;font-size:17px}.row .tt.pop{animation:ttp .4s}@keyframes ttp{50%{transform:scale(1.5)}}
.rkBtns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:none;border-radius:18px;padding:12px 10px;font:700 17px Fredoka;color:#fff;background:linear-gradient(#ff8fc4,#e8549a);box-shadow:0 5px 0 #b8407a,0 8px 16px rgba(160,50,120,.3);cursor:pointer}
.btn.s{flex:.45;background:linear-gradient(#c9b2ff,#9b7ce6);box-shadow:0 5px 0 #6e52b8}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8407a}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="flash"></div>
  <div id="hTop"><div id="hPos">1<small>º/6</small></div><div id="hLap"><div id="hName"></div><span id="hTime">0.0 s</span><div id="hBar"><b id="hBarIn"></b></div></div><div id="hIcon"></div></div>
  <div id="hBoard"></div>
  <div id="toast"></div><div id="count"></div><div id="banner"></div>
  <div id="say"></div><div id="pres"></div><div id="stick"><b></b></div><div id="hint"></div>
  <div id="ctl"><button id="bL">⬅</button><button id="bM" class="mid">🫧</button><button id="bR">➡</button></div>
</div>
<div id="load">Preparando la prueba…</div>
<div id="rank"></div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module" src="js/olimpiadas/juego.js?v=o23"></script>
</body>
</html>
