<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd6ec">
<title>Mochi Party · Olimpiadas</title><link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Fredoka;src:url(fredoka.woff2) format('woff2');font-weight:300 700;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:#ffd6ec;font-family:Fredoka,system-ui,sans-serif;color:#6a4b8a}
body{min-height:100dvh;background:radial-gradient(circle at 50% 0%,#fff3fa,#ffd6ec 55%,#e9c8ff);overflow-x:hidden}
#st3d{position:fixed;left:0;top:0;z-index:0;pointer-events:none}
.vit{display:flex;justify-content:center;margin-top:6px}
.stage3d{width:min(440px,100%);height:min(360px,44dvh);border-radius:28px;cursor:pointer;touch-action:manipulation;}
body.no3d .stage3d{display:none}
.whoRow{display:flex;justify-content:center;margin-top:4px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px}
.back{border:none;background:rgba(255,255,255,.75);border-radius:14px;padding:8px 12px;font:700 14px Fredoka;color:#8b5cc2;box-shadow:0 3px 0 rgba(170,110,200,.3)}
h1{margin:0;flex:1;text-align:center;font-size:clamp(26px,7vw,44px);line-height:1;color:#fff;-webkit-text-stroke:2px #e0609f;text-shadow:0 4px 0 #e0609f,0 8px 18px rgba(200,60,140,.35)}
h1 small{display:block;font-size:.42em;-webkit-text-stroke:1px #8b5cc2;text-shadow:0 2px 0 #8b5cc2;letter-spacing:.06em}
.who{background:rgba(255,255,255,.85);border-radius:18px;padding:6px 14px;font-weight:700;color:#e0609f;box-shadow:0 4px 0 rgba(170,110,200,.25);margin-bottom:6px}
.who small{display:block;font-size:12px;color:#8b5cc2}
.chars{display:grid;grid-template-columns:repeat(5,62px);gap:8px;justify-content:center;padding:8px 2px 12px}
@media (min-aspect-ratio:1/1){.chars{grid-template-columns:repeat(10,58px)}}
.chars button{position:relative;border:2px solid #fff;padding:2px;width:auto;height:auto;border-radius:20px;background:radial-gradient(circle at 35% 25%,#fff,#fff0f8 65%,color-mix(in srgb,var(--c) 30%,#f6dcf0));box-shadow:0 4px 0 rgba(170,110,200,.28),0 8px 14px rgba(150,80,170,.14);cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.chars button.on{border-color:#ff86bd;box-shadow:0 0 0 3px #ff86bd,0 4px 0 #e0559a,0 10px 18px rgba(230,80,150,.3);transform:translateY(-3px) scale(1.04)}
.chars canvas{width:54px;height:54px;display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-aspect-ratio:1/1){.grid{grid-template-columns:repeat(4,1fr)}.stage3d{height:44dvh;width:min(620px,100%)}}
.card{position:relative;border:none;border-radius:24px;padding:12px 10px 10px;min-height:150px;color:#fff;text-align:left;font-family:Fredoka;cursor:pointer;overflow:hidden;box-shadow:0 6px 0 rgba(90,40,110,.35),0 10px 22px rgba(120,40,110,.25);transition:transform .15s;animation:cin .5s cubic-bezier(.3,1.5,.5,1) backwards}
.card:active{transform:scale(.96)}
@keyframes cin{0%{opacity:0;transform:translateY(30px) scale(.85)}}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.card .ic{font-size:46px;line-height:1;display:inline-block;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg) scale(1.06)}}
.card b{display:block;font-size:17px;line-height:1.1;margin-top:6px;text-shadow:0 2px 0 rgba(80,30,90,.45)}
.card small{display:block;font-size:12px;opacity:.95;margin-top:3px;text-shadow:0 1px 0 rgba(80,30,90,.4)}
.card .n{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);color:#8b5cc2;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700}
.card .md{position:absolute;right:8px;bottom:6px;font-size:28px}
#sheet{position:fixed;inset:0;z-index:5;display:none;align-items:flex-end;justify-content:center;background:rgba(80,30,90,.35);backdrop-filter:blur(3px)}
#sheet.on{display:flex}
.sh{width:min(100vw,560px);max-height:92dvh;overflow:auto;background:linear-gradient(#fff,#fff0f8);border-radius:28px 28px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));animation:up .4s cubic-bezier(.3,1.3,.5,1)}
@media (min-aspect-ratio:1/1){#sheet{align-items:center}.sh{border-radius:28px;max-height:94dvh}}
@keyframes up{0%{transform:translateY(80px);opacity:0}}
.sh .hd{border-radius:20px;padding:12px;color:#fff;display:flex;align-items:center;gap:10px}
.sh .hd .ic{font-size:50px}.sh .hd b{font-size:22px;display:block;line-height:1.05;text-shadow:0 2px 0 rgba(80,30,90,.4)}.sh .hd small{font-size:13px}
.ev{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;margin-top:7px;box-shadow:0 3px 0 rgba(170,110,200,.25);cursor:pointer;animation:cin .4s backwards}
.ev .ei{font-size:30px;width:42px;text-align:center}.ev b{display:block;color:#e0609f;font-size:16px}.ev small{display:block;font-size:12.5px;color:#7a5a9a;line-height:1.25}
.ev .go{margin-left:auto;font-size:12px;color:#fff;background:#b9a2f7;border-radius:10px;padding:3px 8px;white-space:nowrap}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:none;border-radius:18px;padding:14px 10px;font:700 18px Fredoka;color:#fff;background:linear-gradient(#ff8fc4,#e8549a);box-shadow:0 5px 0 #b8407a,0 8px 16px rgba(160,50,120,.3);cursor:pointer}
.btn.s{flex:.4;background:linear-gradient(#c9b2ff,#9b7ce6);box-shadow:0 5px 0 #6e52b8}
.btns.top{position:sticky;top:-14px;z-index:2;margin:-14px -14px 10px;padding:12px 14px 10px;background:linear-gradient(#fff 80%,rgba(255,255,255,0))}
.btn.big{font-size:20px;padding:16px 10px;line-height:1.15;animation:pulseB 1.6s ease-in-out infinite}
@keyframes pulseB{50%{transform:scale(1.03)}}
@media (orientation:landscape) and (max-height:500px){.btn.big{font-size:18px;padding:12px 10px}}
.rv{font-size:13px;color:#8b5cc2;margin-top:8px;text-align:center}
</style>
<style>/* noche 25-10: color más vivo (GPU) */canvas{filter:saturate(1.1) contrast(1.04)}</style>
</head>
<body>
<script>window.__desfileOn=()=>true</script><script>window.__DESFILE3D={z:0}</script>
<div class="wrap">
  <div class="top"><button class="back" id="bBack">⬅ Party</button><h1>Mochi Party<small>OLIMPIADAS</small></h1><div style="width:64px"></div></div>
  <div class="scr on vit" id="vit"><div class="stage3d" id="olStage" data-mode="chars" aria-label="Tu mochi (tócalo)"></div></div>
  <div class="whoRow"><div class="who" id="who"></div></div>
  <div class="chars" id="chars"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="sheet"><div class="sh" id="sh"></div></div>
<script src="../js/musica.js?v=o45"></script>
<script>window.FX_NOCHE={z:4,n:20,vig:.12}</script><script src="../js/fx-noche.js?v=o45"></script>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module" src="../js/desfile3d.js?v=o45"></script>
<script type="module" src="js/olimpiadas/menu.js?v=o45"></script>
</body>
</html>
