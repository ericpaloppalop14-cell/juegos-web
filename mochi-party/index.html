<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<title>Mochi Party</title><link rel="manifest" href="manifest.json"><meta property="og:title" content="Mochi Party"><meta property="og:site_name" content="Mochi Party"><meta name="application-name" content="Mochi Party"><meta name="apple-mobile-web-app-title" content="Mochi Party">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Fredoka';src:url(fredoka.woff2) format('woff2');font-weight:300 700;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1650;font-family:'Fredoka',system-ui,sans-serif;color:#6a3f9a;touch-action:none}
canvas#c{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 20px;overflow:auto;background:linear-gradient(#ffd0e6,#ffe6d2 50%,#d9f5ff)}
.scr.on{display:flex}
h1{margin:0;font-size:50px;line-height:.95;color:#ff6fae;text-align:center;text-shadow:0 4px 0 #fff,0 8px 0 rgba(180,90,170,.25)}
h1 span{color:#7a5ce0}
h2{margin:0;font-size:28px;color:#ff6fae;text-align:center}
.sub{margin:0;font-weight:600;color:#9a72c8;text-align:center;font-size:15px}
.btn{font:700 19px 'Fredoka';border:none;border-radius:22px;padding:12px 24px;color:#fff;background:#ff86bd;box-shadow:0 5px 0 #e0559a;min-width:230px}
.btn.v{background:#9b82f0;box-shadow:0 5px 0 #6f55c9}.btn.g{background:#5fc7a6;box-shadow:0 5px 0 #3fa585}
.btn.s{font-size:15px;padding:8px 16px;min-width:0;background:#fff;color:#9a6ac8;box-shadow:0 3px 0 rgba(160,110,200,.35)}
.btn:active{transform:translateY(3px);box-shadow:none}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:min(360px,100%)}
.ev{border:none;border-radius:20px;background:#fff;padding:10px 8px;font:700 15px 'Fredoka';color:#7a4fb0;box-shadow:0 4px 0 rgba(170,110,200,.3);display:flex;flex-direction:column;align-items:center;gap:2px}
.ev b{font-size:30px}.ev small{font-weight:500;color:#a888c8;font-size:12px}
.chars{display:grid;grid-template-columns:repeat(5,62px);gap:8px}
.chars button{border:none;background:#fff;border-radius:18px;padding:2px;box-shadow:0 3px 0 rgba(170,110,200,.3)}
.chars button.on{outline:4px solid #ff86bd}
.chars canvas{width:58px;height:58px;display:block}
.who{font-weight:700;font-size:18px;text-align:center}.who small{display:block;font-weight:500;font-size:13px;color:#a080c0}
table{border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;width:min(340px,100%);font-size:15px}
td{padding:6px 8px;border-bottom:1px solid #f4e6f4}td.n{text-align:right;font-weight:700}
tr.me{background:#fff0f8;font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
#podio canvas{width:min(340px,92vw);height:auto}
.quote{background:#fff;border-radius:16px;padding:8px 14px;font-weight:600;font-size:15px;max-width:340px;text-align:center;box-shadow:0 3px 0 rgba(170,110,200,.25)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;background:rgba(255,255,255,.92);padding:8px 14px;border-radius:16px;font-weight:600;font-size:15px;text-align:center;max-width:92vw;pointer-events:none;transition:opacity .5s}
#topbtn{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:6;width:40px;height:40px;border-radius:14px;border:none;background:rgba(255,255,255,.85);font:700 20px 'Fredoka';color:#9a6ac8;display:none}

/* ---------- Pantalla de inicio ---------- */
#sMenu{background:transparent;justify-content:flex-start;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));isolation:isolate}
#menuBg{position:fixed;inset:0;z-index:-1;pointer-events:none}
#sMenu>*:not(#menuBg){animation:mIn .55s cubic-bezier(.2,1.3,.4,1) both}
#sMenu>.mHero{animation-delay:.06s}#sMenu>.mMain{animation-delay:.12s}#sMenu>.mEvs{animation-delay:.18s}#sMenu>.mPj{animation-delay:.24s}
@keyframes mIn{from{opacity:0;transform:translateY(18px) scale(.96)}}
.mTop{text-align:center}
.mLogo{font-size:52px;line-height:.86;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 6px 10px rgba(150,60,150,.25))}
.mLogo span{display:block;letter-spacing:.5px;text-shadow:0 0 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 7px 0 #fff,0 10px 0 rgba(180,90,170,.28)}
.mLogo .l1{color:#ff63a8;transform:rotate(-3deg)}
.mLogo .l2{color:#7a5ce0;font-size:60px;transform:rotate(2deg);animation:mWig 3s ease-in-out infinite}
@keyframes mWig{50%{transform:rotate(-1deg) scale(1.03)}}
.mSub{margin:8px auto 0;font-weight:600;font-size:14px;color:#8a5cc0;background:rgba(255,255,255,.62);padding:5px 14px;border-radius:99px;box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(150,80,170,.12);display:inline-block}
.mHero{display:flex;flex-direction:column;align-items:center;margin-top:-6px}
#menuHero{width:190px;height:160px;display:block;touch-action:manipulation;cursor:pointer}
.mWho{margin-top:-6px;background:linear-gradient(#fff,#fff4fa);padding:5px 18px 6px;border-radius:16px;color:#6a3f9a;box-shadow:0 4px 12px rgba(150,80,170,.18),inset 0 -2px 0 rgba(200,150,220,.25)}
.mWho small{font-size:12px}
.mCard{width:min(370px,100%);background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.5));border:1.5px solid rgba(255,255,255,.9);border-radius:26px;padding:12px;box-shadow:0 10px 26px rgba(140,70,160,.16),inset 0 1px 0 #fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mMain{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.mLabel{font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#b07ccc;margin:0 4px 8px;display:flex;align-items:center;gap:8px}
.mLabel::after{content:'';flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(200,150,220,.5),transparent)}
#sMenu .btn{position:relative;overflow:hidden;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s,filter .12s}
#sMenu .btn::before{content:'';position:absolute;left:8%;right:8%;top:4px;height:42%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
#sMenu .btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:mShine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes mShine{0%,70%{left:-60%}100%{left:130%}}
.mBtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:9px 14px;border-radius:22px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.mBtn i{font-style:normal;font-size:26px;width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:15px;background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(0,0,0,.08)}
.mBtn span{display:flex;flex-direction:column;line-height:1.1}
.mBtn small{font-weight:500;font-size:13px;opacity:.9;text-shadow:none}
#bOlimp{position:relative;background:linear-gradient(135deg,#ffd84a,#ff9a3a 55%,#ff6fae);color:#fff;box-shadow:0 6px 0 #d0702a,0 0 0 3px #fff,0 10px 26px rgba(255,150,60,.55);animation:olP 1.8s ease-in-out infinite;font-size:22px}
#bOlimp .nuevo{position:absolute;right:10px;top:4px;background:#ff3f7f;color:#fff;font:700 11px Fredoka,sans-serif;padding:2px 8px;border-radius:10px;border:2px solid #fff;transform:rotate(6deg)}
@keyframes olP{50%{transform:scale(1.035)}}
#bTorneo{background:linear-gradient(#ffa4cf,#ff79b5 55%,#f562a6);box-shadow:0 6px 0 #d94c91,0 12px 18px rgba(230,80,150,.32)}
#bOnline{background:linear-gradient(#86e3c4,#5fc7a6 55%,#4cb795);box-shadow:0 6px 0 #379a7b,0 12px 18px rgba(60,170,130,.3)}
#bTorneo::after{animation-delay:.6s}
#sMenu .btn:active{transform:translateY(5px) scale(.98);filter:brightness(1.05)}
#bTorneo:active{box-shadow:0 1px 0 #d94c91,0 4px 8px rgba(230,80,150,.3)}#bOnline:active{box-shadow:0 1px 0 #379a7b,0 4px 8px rgba(60,170,130,.3)}
#sMenu .evs{width:100%;gap:10px}
#sMenu .ev{position:relative;flex-direction:row;justify-content:flex-start;text-align:left;gap:9px;padding:7px 9px;min-height:56px;border-radius:18px;background:linear-gradient(#fff,#fbf3ff);font-size:14px;line-height:1.12;color:#6e45a8;box-shadow:0 4px 0 rgba(170,110,200,.28),0 8px 14px rgba(150,80,170,.1),inset 0 1px 0 #fff;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
#sMenu .ev b{font-size:24px;width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:14px;background:radial-gradient(circle at 32% 28%,#fff,#ffe1f0 60%,#f6cbe8);box-shadow:inset 0 -2px 0 rgba(220,140,200,.35),0 2px 4px rgba(150,80,170,.15)}
#sMenu .ev:nth-child(2n) b{background:radial-gradient(circle at 32% 28%,#fff,#e6defe 60%,#d3c6fb)}
#sMenu .ev:nth-child(3n) b{background:radial-gradient(circle at 32% 28%,#fff,#dcf5ff 60%,#c2e7fa)}
#sMenu .ev small{display:none}
#sMenu .ev:active{transform:translateY(4px) scale(.97);box-shadow:0 0 0 rgba(170,110,200,.28),0 3px 6px rgba(150,80,170,.1)}
.mPj{min-width:0;padding:10px 20px;border-radius:99px;background:linear-gradient(#fff,#f6eefd)!important;color:#8a5cc0!important;box-shadow:0 4px 0 rgba(160,110,200,.35),0 8px 14px rgba(150,80,170,.12)!important}
.mPj:active{box-shadow:0 0 0 rgba(160,110,200,.35)!important}
@media (max-height:720px){.mLogo{font-size:46px}.mLogo .l2{font-size:52px}#menuHero{width:170px;height:144px}}

/* inicio: que la parte de abajo se vea entera y se pueda hacer scroll */
#sMenu{inset:auto;top:0;left:0;right:0;height:100vh;height:100dvh;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#sMenu::after{content:'';flex:none;height:calc(14px + env(safe-area-inset-bottom));width:1px}
#sMenu>*{flex-shrink:0}
@media (max-height:700px){#sMenu{gap:8px}.mLogo{font-size:42px}.mLogo .l2{font-size:48px}#menuHero{width:150px;height:126px}.mSub{font-size:13px;margin-top:4px}}
@media (prefers-reduced-motion:reduce){#sMenu *{animation:none!important}}

/* ---------- pulido v3: elegir mochi, presentación y podio (la pantalla de inicio no se toca) ---------- */
#sChars,#sIntro,#sPodio{isolation:isolate;background:radial-gradient(120% 70% at 50% 0%,#fff6fb 0%,#ffe3f1 45%,#f3dcff 100%)}
#sChars::before,#sIntro::before,#sPodio::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.8) 0 3px,transparent 4px),radial-gradient(circle at 86% 30%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 70% 82%,rgba(255,255,255,.7) 0 3px,transparent 4px),radial-gradient(circle at 22% 70%,rgba(255,182,220,.35) 0 60px,transparent 61px),radial-gradient(circle at 90% 90%,rgba(200,170,255,.3) 0 80px,transparent 81px)}
#sChars h2,#sIntro h2,#sPodio h2{font-size:27px;line-height:1.1;color:#ff5fa4;text-shadow:0 3px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 6px 10px rgba(180,80,160,.25);padding:0 8px}
#iIcon{width:96px;height:96px;display:grid;place-items:center;border-radius:30px;background:radial-gradient(circle at 32% 26%,#fff,#ffe6f3 60%,#f7cde8);border:3px solid #fff;box-shadow:0 8px 20px rgba(170,80,160,.25),inset 0 -4px 0 rgba(220,140,200,.3);font-size:56px!important;animation:iBob 2.4s ease-in-out infinite}
@keyframes iBob{50%{transform:translateY(-5px) rotate(-3deg)}}
#sIntro .sub{max-width:350px;background:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.95);border-radius:18px;padding:8px 14px;line-height:1.3;box-shadow:0 4px 12px rgba(150,80,170,.1)}
.quote{border:2px solid #fff;border-radius:20px;background:linear-gradient(#fff,#fff5fb);box-shadow:0 6px 16px rgba(150,80,170,.18),inset 0 -3px 0 rgba(220,170,230,.3);padding:9px 16px;color:#6a3f9a}
.quote b{color:#e0559a}
#sIntro table,#sPodio table{border-collapse:separate;border-spacing:0;border:2px solid #fff;border-radius:20px;box-shadow:0 8px 22px rgba(140,70,160,.18);background:linear-gradient(#fff,#fdf6ff);overflow:hidden}
#sIntro tr:first-child td,#sPodio tr:first-child td{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#b07ccc;background:#fbf0ff}
#sIntro td,#sPodio td{padding:7px 10px;border-bottom:1px solid #f6e8f6}
#sIntro tr:last-child td,#sPodio tr:last-child td{border-bottom:none}
#sPodio tr.me td{background:linear-gradient(90deg,#ffe8f4,#fff3fa)}#sPodio tr.me td:first-child{box-shadow:inset 4px 0 0 #ff6fae}
#sPodio tr:nth-child(2) td:first-child::before{content:'🥇';margin-right:2px}#sPodio tr:nth-child(3) td:first-child::before{content:'🥈';margin-right:2px}#sPodio tr:nth-child(4) td:first-child::before{content:'🥉';margin-right:2px}
.dot{width:13px;height:13px;border:2px solid #fff;box-shadow:0 1px 3px rgba(80,30,100,.35)}
#sChars .btn,#sIntro .btn,#sPodio .btn{position:relative;overflow:hidden;background:linear-gradient(#ffa4cf,#ff79b5 55%,#f562a6);box-shadow:0 6px 0 #d94c91,0 12px 18px rgba(230,80,150,.3);border-radius:22px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
#sChars .btn::before,#sIntro .btn::before,#sPodio .btn::before{content:'';position:absolute;left:8%;right:8%;top:4px;height:42%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
#sChars .btn.s,#sIntro .btn.s,#sPodio .btn.s{background:linear-gradient(#fff,#fbf3ff);color:#9a6ac8;box-shadow:0 4px 0 rgba(160,110,200,.3),0 8px 14px rgba(150,80,170,.15);border:1.5px solid #fff;text-shadow:none}
#sChars .btn:active,#sIntro .btn:active,#sPodio .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d94c91}
.chars{gap:10px}
.chars button{border:2px solid #fff;border-radius:20px;background:radial-gradient(circle at 35% 25%,#fff,#fff0f8 65%,#f6dcf0);box-shadow:0 4px 0 rgba(170,110,200,.28),0 8px 14px rgba(150,80,170,.14);transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.chars button.on{outline:none;border-color:#ff86bd;box-shadow:0 0 0 3px #ff86bd,0 4px 0 #e0559a,0 10px 18px rgba(230,80,150,.3);transform:translateY(-3px) scale(1.04)}
#charWho{background:linear-gradient(#fff,#fff4fa);border:2px solid #fff;border-radius:18px;padding:8px 16px;box-shadow:0 6px 14px rgba(150,80,170,.16);max-width:340px}
#podio{position:relative;padding:4px;border-radius:26px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.35));border:2px solid #fff;box-shadow:0 10px 26px rgba(140,70,160,.18)}

/* ================= tanda 4: escenario 3D, presentación y clasificaciones animadas ================= */
#bgGrad{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.8) 0 3px,transparent 4px),radial-gradient(circle at 86% 30%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 70% 82%,rgba(255,255,255,.7) 0 3px,transparent 4px),radial-gradient(circle at 22% 70%,rgba(255,182,220,.35) 0 60px,transparent 61px),radial-gradient(circle at 90% 90%,rgba(200,170,255,.3) 0 80px,transparent 81px),radial-gradient(120% 70% at 50% 0%,#fff6fb 0%,#ffe3f1 45%,#f3dcff 100%)}
#menuBg{position:fixed;inset:0;z-index:8;pointer-events:none}
#st3d{position:fixed;left:0;top:0;z-index:9;pointer-events:none}
canvas#c{z-index:9}
.scr,#sChars,#sIntro,#sPodio{background:transparent!important}
#sChars::before,#sIntro::before,#sPodio::before{display:none}
.stage3d{width:min(380px,100%);height:230px;flex:none;position:relative;border-radius:28px;cursor:pointer;touch-action:manipulation}
.stage3d::after{content:'';position:absolute;left:12%;right:12%;bottom:-4px;height:18px;border-radius:50%;background:radial-gradient(rgba(150,60,150,.18),transparent 70%);z-index:-1}
#menuHero{display:none}body.no3d #menuHero{display:block}body.no3d .stage3d{display:none}body.no3d #podioCv{display:block}
#menuStage{width:min(440px,100vw);height:250px;align-self:center}
@media (orientation:landscape) and (max-height:600px){#menuStage{width:min(400px,44vw)!important;min-width:min(360px,42vw);height:calc(100dvh - 150px);min-height:150px}}
#menuStage{height:225px;margin-top:-6px}
#sMenu .ev{animation:evPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes evPop{from{opacity:0;transform:translateY(16px) scale(.8) rotate(-3deg)}}
#bTorneo{animation:mIn .55s cubic-bezier(.2,1.3,.4,1) both,pulse 2.2s ease-in-out 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.mLogo .l1{animation:lgDrop .7s cubic-bezier(.3,1.6,.5,1) both}.mLogo .l2{animation:lgDrop .7s cubic-bezier(.3,1.6,.5,1) .12s both,mWig 3s ease-in-out 1s infinite}
@keyframes lgDrop{from{opacity:0;transform:translateY(-60px) scale(1.4) rotate(-8deg)}}
/* pantallas con barra de botones fija abajo (no se corta ni parpadea, en vertical y en horizontal) */
#sChars.on,#sIntro.on,#sPodio.on{display:flex;justify-content:flex-start;overflow:hidden;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.lay{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 4px 10px}
.colA,.colB{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.bar{flex:none;width:calc(100% + 24px);margin:0 -12px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,240,250,0),rgba(255,240,250,.92) 30%);position:relative;z-index:2;contain:layout paint}
.bar .btn{min-width:200px}
#bNext,#bGo{animation:barIn .5s cubic-bezier(.3,1.6,.5,1) .3s both}
@keyframes barIn{from{opacity:0;transform:translateY(30px)}}
#sIntro .stage3d{height:240px}
#iHead{display:flex;align-items:center;gap:10px}#iHead #iIcon{width:64px;height:64px;font-size:38px!important;border-radius:22px}
#iName{animation:tIn .6s cubic-bezier(.3,1.6,.5,1) both}
#sPodio .stage3d{height:300px;width:min(520px,100%)}
#pTitle{animation:tIn .7s cubic-bezier(.3,1.6,.5,1) both,tWob 2.6s ease-in-out 1s infinite}
@keyframes tIn{from{opacity:0;transform:scale(.3) rotate(-8deg)}}@keyframes tWob{50%{transform:scale(1.05) rotate(-1.5deg)}}
#podio{display:none}#podioCv{display:none}body.no3d #podio{display:block}
#sIntro tr,#sPodio tr{animation:rowIn .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-46px) scale(.85)}}
#sPodio tr.me td{animation:meGlow 1.6s ease-in-out 1.5s infinite}
@keyframes meGlow{50%{background:#ffd3ea}}
#sPodio td.n b{display:inline-block}#sPodio td.n b.up{animation:numPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes numPop{50%{transform:scale(1.6);color:#ff4f9a}}
#pQuote{animation:barIn .5s cubic-bezier(.3,1.6,.5,1) .9s both}
.chars{animation:barIn .5s both}
#sChars .stage3d{height:min(330px,46dvh);width:min(420px,100%)}
@media (orientation:landscape) and (max-height:560px){
  #sMenu.on{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"top main" "hero evs" "hero pj";align-items:start;justify-items:center;column-gap:14px;row-gap:8px;padding-top:calc(8px + env(safe-area-inset-top))}
  #sMenu>.mTop{grid-area:top}#sMenu>.mHero{grid-area:hero;margin:0}#sMenu>.mMain{grid-area:main;padding-bottom:12px}#sMenu>.mEvs{grid-area:evs}#sMenu>.mPj{grid-area:pj}
