<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a5cff">
<title>Escondite en el Cuadro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Fredoka;src:url(lib/fredoka.woff2) format('woff2');font-weight:300 700}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2a6b;font-family:Fredoka,system-ui,sans-serif;color:#5a2a7e;touch-action:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;z-index:5;background:radial-gradient(circle at 50% 30%,rgba(255,220,170,.35),rgba(60,30,110,.55))}
.scr.on{display:flex}
.logo{font-size:clamp(34px,8.5vw,64px);font-weight:700;text-align:center;line-height:.95;color:#fff;text-shadow:0 4px 0 #ff6fb5,0 8px 0 #7a5cff,0 12px 26px rgba(40,10,90,.45)}
.logo span{display:block;font-size:.6em;color:#fff38a;text-shadow:0 4px 0 #ff9f3d,0 8px 0 #ff5f8f}
.sub{color:#6a3aa0;font-size:16px;text-align:center;background:rgba(255,255,255,.9);padding:6px 14px;border-radius:20px;max-width:460px}
.btn{min-width:230px;min-height:54px;padding:10px 20px;border-radius:28px;border:none;background:linear-gradient(180deg,#ffb3dc,#ff6fb5);color:#fff;font:700 21px Fredoka,sans-serif;text-shadow:0 2px 0 rgba(160,40,110,.4);box-shadow:0 5px 0 #d04a8f,0 8px 18px rgba(200,60,140,.35);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d04a8f}
.btn.teal{background:linear-gradient(180deg,#9ff5e4,#3fd1b5);box-shadow:0 5px 0 #23a08a}
.btn.yel{background:linear-gradient(180deg,#fff19a,#ffc23d);color:#8a4a00;text-shadow:none;box-shadow:0 5px 0 #e09a10}
.btn.lil{background:linear-gradient(180deg,#d9c4ff,#a77bff);box-shadow:0 5px 0 #7a50d8}
.btn.sm{min-width:0;min-height:48px;padding:8px 16px;font-size:18px}
.btn[disabled]{background:#b9b3c6;box-shadow:0 5px 0 #8f8a9c;color:#eee;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.lv{display:flex;background:rgba(255,255,255,.9);border-radius:26px;padding:4px;gap:4px}
.lv button{border:none;border-radius:22px;min-height:50px;padding:6px 16px;font:700 18px Fredoka;background:transparent;color:#7a50d8}
.lv button.on{background:#7a5cff;color:#fff}
.ver{position:fixed;right:10px;bottom:8px;color:#fff;font-size:13px;opacity:.85;z-index:6}
h2{margin:2px 0;font-size:28px;color:#fff;text-shadow:0 3px 0 #ff6fb5;text-align:center}
.tcard{background:#fff;border-radius:24px;padding:18px;max-width:360px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(30,10,80,.4);border:6px solid #ffd45a}
.tcard .em{font-size:66px;line-height:1.1}
.tcard b{display:block;font-size:24px;color:#7a3aa0;margin:6px 0}
.tcard p{margin:0;font-size:17px;color:#6a4a8a}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#fff6;display:block}.dots i.on{background:#fff}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
#hud.on{display:block}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:64px;right:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.92);border-radius:20px;padding:6px 14px;font-weight:700;font-size:18px;color:#6a3aa0;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#sim{min-width:150px;text-align:center;position:relative;overflow:hidden}
#simbar{position:absolute;left:0;top:0;bottom:0;background:#9ff5c0;z-index:-1;transition:width .15s}
#msg{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:700;color:#fff;text-shadow:0 3px 0 #ff6fb5,0 0 12px rgba(0,0,0,.4);text-align:center;opacity:0;transition:opacity .3s;width:90%}
#bx{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top));pointer-events:auto;min-width:48px;min-height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:22px}
#acts{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#acts button,.pb{width:64px;height:64px;border-radius:50%;border:none;font-size:28px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 #a77bff;color:#7a50d8;font-family:Fredoka}
#acts button small{display:block;font-size:11px;margin-top:-4px}
#pal{position:absolute;left:0;right:0;bottom:0;padding:8px 86px calc(8px + env(safe-area-inset-bottom)) 10px;background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,.85) 18%);pointer-events:auto;display:none}
#pal.on{display:block}
#pal .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px}
@media (orientation:landscape){#pal{left:0;right:auto;top:calc(56px + env(safe-area-inset-top));bottom:auto;width:min(320px,38vw);padding:6px 10px;border-radius:0 20px 20px 0;background:rgba(255,255,255,.88);max-height:calc(100vh - 64px);overflow:auto}#pal .g{grid-template-columns:repeat(2,1fr);gap:0 10px}#hud.palon #msg{left:calc(50% + 160px);width:calc(100% - 360px);font-size:22px}#pal .pr{flex-wrap:wrap;gap:6px}#pal .pr button{padding:4px 10px;font-size:15px}}
#pal label{font-size:14px;font-weight:700;color:#6a3aa0;display:flex;flex-direction:column}
#pal input[type=range]{width:100%;height:48px;margin:0;-webkit-appearance:none;background:transparent}
#pal input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:#e7dcff}
#pal input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#7a5cff;border:3px solid #fff;margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#pal .pr{display:flex;gap:8px;margin-bottom:4px;justify-content:center}
#pal .pr button{min-height:48px;border-radius:22px;border:none;padding:4px 14px;font:700 16px Fredoka;background:#fff;color:#7a50d8;box-shadow:0 3px 0 #c9b6ff}
#bDisf{position:absolute;right:88px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;min-height:60px;padding:8px 22px;border:none;border-radius:30px;font:700 20px Fredoka;color:#fff;background:linear-gradient(180deg,#ffd36e,#ff9f3d);box-shadow:0 5px 0 #d07a10;max-width:calc(100vw - 110px);white-space:nowrap;line-height:1.1}
#bDisf small{display:block;font-size:13px;font-weight:600}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);display:none;z-index:2;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.9)}
#res .big{font-size:60px}
#res .tcard p{font-size:19px}
input.code{font:700 26px Fredoka;width:140px;text-align:center;border-radius:20px;border:3px solid #a77bff;padding:6px;text-transform:uppercase}

#pal .pc,#pal .ps{pointer-events:auto}
.hrow{display:flex;gap:6px;align-items:center;margin:2px 0}
.hrow canvas{flex:1;height:48px;width:10px;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none}
.fb{min-width:48px;min-height:48px;border:none;border-radius:50%;background:#fff;color:#7a50d8;font:700 20px Fredoka;box-shadow:0 3px 0 #c9b6ff}
.sw{display:flex;gap:6px;justify-content:center;margin:4px 0}
.sw button{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hint{text-align:center;font-weight:700;font-size:15px;color:#6a3aa0;min-height:20px}
#pal .g{grid-template-columns:1fr 1fr!important}
.ps{display:flex;gap:14px;justify-content:center;margin-top:4px}
.pad,.dial{position:relative;width:124px;height:124px;background:#f3ecff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:none}
.pad{border-radius:18px}.dial{border-radius:50%;background:radial-gradient(circle,#fff 38%,#e2d4ff 40%,#e2d4ff 62%,#f3ecff 64%)}
.shape{position:absolute;left:50%;top:50%;background:rgba(122,92,255,.35);border:2px dashed #7a5cff;border-radius:6px;transform:translate(-50%,-50%)}
.knob{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#7a5cff;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.pl{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;font-weight:700;color:#7a50d8;pointer-events:none}
@media (orientation:landscape){#pal.on{display:block;background:none!important;inset:0;padding:0;width:auto;max-height:none;pointer-events:none;overflow:visible}
 #pal .pc{position:absolute;left:0;top:calc(56px + env(safe-area-inset-top));width:min(310px,37vw);max-height:calc(100vh - 62px);overflow:auto;background:rgba(255,255,255,.9);border-radius:0 20px 20px 0;padding:6px 8px}
 #pal .ps{position:absolute;right:88px;bottom:calc(8px + env(safe-area-inset-bottom));margin:0;background:rgba(255,255,255,.85);border-radius:20px;padding:6px}
 .pad,.dial{width:112px;height:112px}}
@media (orientation:landscape) and (max-height:380px){
 #pal .pc{padding:3px 6px;max-height:calc(100vh - 58px);top:calc(52px + env(safe-area-inset-top))}
 #pal .pr{flex-wrap:nowrap;gap:4px;margin-bottom:2px}#pal .pr button{font-size:13px;padding:2px 8px}
 .hrow,.sw{margin:1px 0}.sw{gap:4px}.hint{font-size:12px;min-height:0}
 #pal label{font-size:12px}#pal .g{gap:0 8px}
 .pad,.dial{width:100px;height:100px}#pal .ps{padding:4px}
 .scr{gap:6px;padding:6px}.tcard{padding:10px}.tcard .em{font-size:44px}#res .big{font-size:40px}}
@media (orientation:portrait){.logo{font-size:clamp(48px,15vw,84px)}#top{flex-wrap:nowrap;gap:5px}.pill{font-size:16px;padding:6px 10px;white-space:nowrap}#sim{min-width:0}}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="joy"><i></i></div>

<div class="scr on" id="menu">
  <div class="logo">Escondite<span>en el Cuadro</span></div>
  <div class="sub">Disfrázate de un objeto de la biblioteca y ajústalo hasta que sea igualito</div>
  <div class="row"><button class="btn" id="bHide">🙈 Escóndete</button><button class="btn teal" id="bSeek">🔍 Busca</button></div>
  <div class="lv" id="lv"><button data-l="0">Fácil</button><button data-l="1" class="on">Normal</button><button data-l="2">Difícil</button></div>
  <div class="row"><button class="btn lil" id="bOnline" disabled>🌐 Online · pronto</button><button class="btn yel" id="bTuto">❓ Cómo se juega</button></div>
</div>

<div class="scr" id="tuto">
  <div class="tcard"><div class="em" id="tEm"></div><b id="tTi"></b><p id="tTx"></p></div>
  <div class="dots"><i></i><i></i><i></i></div>
  <button class="btn" id="tNext">Siguiente ▶</button>
</div>

<div class="scr" id="onl">
  <h2>🌐 Sala online</h2>
  <div class="sub" id="oTx">Crea una sala o escribe el código de un amigo</div>
  <div class="row"><button class="btn sm" id="oCrear">Crear sala</button><input class="code" id="oCode" maxlength="4" placeholder="ABCD"><button class="btn teal sm" id="oUnir">Entrar</button></div>
  <div class="sub" id="oList" style="display:none"></div>
  <div class="row"><button class="btn yel sm" id="oEmp" style="display:none">▶ Empezar</button><button class="btn lil sm" id="oSalir">Volver</button></div>
</div>

<div class="scr" id="conf"><div class="tcard"><b>¿Salir de la partida?</b><p>Perderás esta ronda.</p></div><div class="row"><button class="btn" id="cNo">▶ Seguir jugando</button><button class="btn lil" id="cSi">Sí, salir</button></div></div>
<div class="scr" id="res">
  <div class="tcard"><div class="big" id="rEm"></div><b id="rTi"></b><p id="rTx"></p></div>
  <div class="row"><button class="btn" id="rOtra">🔁 Otra vez</button><button class="btn lil" id="rMenu">Menú</button></div>
</div>

<div id="hud">
  <div id="top"><span class="pill" id="tim">2:00</span><span class="pill" id="sim"><span id="simbar"></span><span id="simtx">Parecido —</span></span><span class="pill" id="pts">0 pts</span></div>
  <button id="bx">✕</button>
  <div id="msg"></div>
  <div id="pal">
    <div class="pc">
      <div class="pr"><button id="pGota">💧 Cuentagotas</button><button id="pPat">Patrón: liso</button><button id="pOut">↩ Salir</button></div>
      <div class="hrow"><button class="fb" id="hM">◀</button><canvas id="hStrip" width="300" height="48"></canvas><button class="fb" id="hP">▶</button></div>
      <div class="sw" id="sw"></div>
      <div class="hint" id="hint">🌈 Elige el color que más se parezca</div>
      <div class="g">
        <label>☀️ Claridad<input type="range" id="sL" min="-100" max="100" value="0"></label>
        <label>💜 Saturación<input type="range" id="sS" min="-100" max="100" value="0"></label>
      </div>
      <input type="range" id="sH" min="-100" max="100" value="0" hidden><input type="range" id="sW" min="-100" max="100" value="0" hidden><input type="range" id="sA" min="-100" max="100" value="0" hidden><input type="range" id="sR" min="-100" max="100" value="0" hidden>
    </div>
    <div class="ps">
      <div class="pad" id="pad"><div class="shape" id="padShape"></div><div class="knob" id="padKnob">⤡</div><span class="pl">↔️ ancho · ↕️ alto</span></div>
      <div class="dial" id="dial"><div class="knob" id="dialKnob">🔄</div><span class="pl">girar</span></div>
    </div>
  </div>
  <button id="bDisf" style="display:none">✨ Disfrazarse</button>
  <div id="acts"><button id="bPal">🎨<small>ajustar</small></button><button id="bWh">🎵<small>silbar</small></button><button id="bJump">🦘<small>saltar</small></button></div>
</div>
<div class="ver" id="ver"></div>
<script src="online-config.js"></script>
<script src="online-cf.js"></script>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<script type="module" src="game.js?v=15"></script>
</body></html>
