<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mochi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fredoka.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Fredoka';src:url(fredoka.woff2) format('woff2');font-weight:300 700;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#ffe9d6;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}
body{font-family:'Fredoka',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;color:#7a4b8a}
canvas{position:absolute;inset:0;display:block;touch-action:none}
.ui{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;flex-direction:column;align-items:center;padding-top:14px;transition:opacity .3s}
#score{font-size:46px;font-weight:700;color:#fff;letter-spacing:1px;line-height:1;
 text-shadow:0 3px 0 #e58bb5,0 0 0 #e58bb5,2px 2px 0 #e58bb5,-2px 2px 0 #e58bb5,2px -1px 0 #e58bb5,-2px -1px 0 #e58bb5,0 6px 14px rgba(160,80,140,.35);transition:transform .12s}
#score.pop{transform:scale(1.18)}
#combo{margin-top:6px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff9ec7,#b9a1f5);padding:3px 12px;border-radius:20px;box-shadow:0 3px 0 rgba(150,90,170,.35);opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
#combo.on{opacity:1;transform:scale(1)}
#best-hud{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(16px + env(safe-area-inset-top));font-size:15px;font-weight:600;color:#fff;background:rgba(170,120,200,.35);padding:4px 10px;border-radius:14px}
#mute{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.7);box-shadow:0 3px 0 rgba(180,120,190,.35);pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:5}
#mute svg{width:26px;height:26px}
#hint{position:absolute;left:0;right:0;top:calc(108px + env(safe-area-inset-top));display:flex;justify-content:center;opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s}
#hint.on{opacity:1;transform:none}
#hint span{background:rgba(255,255,255,.88);color:#8a5aa8;font-weight:600;font-size:20px;padding:10px 18px;border-radius:22px;box-shadow:0 4px 0 rgba(190,130,200,.35);text-align:center;max-width:88vw}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);transition:opacity .35s;opacity:0;visibility:hidden}
.screen.on{opacity:1;visibility:visible}
#title{justify-content:flex-start}
.logo{margin-top:calc(9vh);font-size:min(30vw,150px);font-weight:700;line-height:1;color:#fff;letter-spacing:2px;
 text-shadow:0 5px 0 #f08cbc,3px 3px 0 #f08cbc,-3px 3px 0 #f08cbc,3px -2px 0 #f08cbc,-3px -2px 0 #f08cbc,0 9px 0 #c58ae0,0 16px 26px rgba(170,90,170,.35);
 animation:float 2.6s ease-in-out infinite}
.logo .l{display:inline-block;animation:wob 1.8s ease-in-out infinite}
.logo .l:nth-child(2){animation-delay:.12s}.logo .l:nth-child(3){animation-delay:.24s}.logo .l:nth-child(4){animation-delay:.36s}.logo .l:nth-child(5){animation-delay:.48s}
@keyframes wob{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(-6px) scale(.94,1.08)}40%{transform:translateY(0) scale(1.06,.94)}55%{transform:scale(1,1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sub{margin-top:10px;font-size:19px;font-weight:600;color:#a374c4;background:rgba(255,255,255,.6);padding:4px 14px;border-radius:16px}
.tap{position:absolute;bottom:calc(9vh + env(safe-area-inset-bottom));font-size:26px;font-weight:700;color:#fff;background:linear-gradient(180deg,#ffa9cf,#f37fb4);padding:14px 34px;border-radius:40px;box-shadow:0 6px 0 #d0609a,0 12px 22px rgba(200,90,150,.35);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.bestline{position:absolute;bottom:calc(9vh + 92px + env(safe-area-inset-bottom));font-size:18px;font-weight:600;color:#fff;background:rgba(160,110,200,.4);padding:4px 14px;border-radius:16px}
#over{justify-content:center;background:rgba(255,230,240,.25)}
.card{background:rgba(255,255,255,.92);border-radius:30px;padding:22px 30px 26px;min-width:250px;text-align:center;box-shadow:0 8px 0 rgba(200,140,210,.45),0 20px 40px rgba(150,80,150,.25);transform:scale(.8);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#over.on .card{transform:scale(1)}
.card h2{margin:0 0 6px;font-size:44px;color:#f27bb2;font-weight:700}
.card .lbl{font-size:16px;color:#b08ac8;font-weight:600;margin-top:8px}
.card .big{font-size:56px;font-weight:700;color:#8b5cc2;line-height:1.05}
.card .rec{font-size:24px;font-weight:700;color:#5fc7a6}
.card .nr{display:none;margin-top:8px;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ffb36b,#ff8fc0);border-radius:16px;padding:4px 12px;animation:pulse .8s infinite}
.card .nr.on{display:inline-block}
#over .tap{position:static;margin-top:26px;font-size:22px;padding:12px 28px}
#pause{justify-content:center;background:rgba(255,230,240,.45)}
#pause .card h2{color:#a374c4}
.pbtn{pointer-events:auto;font-family:inherit;font-weight:700;border:none;cursor:pointer;color:#8b5cc2;background:rgba(255,255,255,.88);border-radius:30px;box-shadow:0 4px 0 rgba(180,120,200,.45);display:inline-flex;align-items:center;gap:8px}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(180,120,200,.45)}
#charBtn{position:absolute;bottom:calc(9vh + 140px + env(safe-area-inset-bottom));font-size:19px;padding:9px 20px}
#charBtn .dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffb3d6 30%,#c9a8ff 100%)}
.unl{margin-top:10px;font-size:16px;font-weight:600;color:#a88bc4}
.unl.new{color:#fff;background:linear-gradient(90deg,#7ee3c4,#b9a2f7);border-radius:16px;padding:5px 12px;font-weight:700;animation:pulse .9s infinite}
#charBtn2{margin-top:14px;font-size:17px;padding:8px 18px}
#select{pointer-events:none;justify-content:flex-start}
#select .top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:12px}
#select h3{margin:0;font-size:28px;color:#fff;text-shadow:0 3px 0 #f08cbc,2px 2px 0 #f08cbc,-2px 2px 0 #f08cbc,0 6px 12px rgba(170,90,170,.3)}
#selBack{font-size:17px;padding:8px 16px}
#selCount{font-size:16px;font-weight:700;color:#fff;background:rgba(160,110,200,.45);padding:5px 12px;border-radius:14px;margin-right:56px}
#selRecord{margin-top:6px;font-size:14px;font-weight:600;color:#a374c4;background:rgba(255,255,255,.55);padding:2px 10px;border-radius:12px}
.arrow{position:absolute;top:31%;width:52px;height:52px;border-radius:50%;font-size:28px;justify-content:center;padding:0}
#selPrev{left:calc(10px + env(safe-area-inset-left))}#selNext{right:calc(10px + env(safe-area-inset-right))}
#selInfo{position:absolute;top:46%;left:16px;right:16px;text-align:center}
#selName{font-size:34px;font-weight:700;color:#8b5cc2;line-height:1.1}
#selInner{display:inline-block;margin-top:4px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff9ec7,#b9a1f5);padding:3px 12px;border-radius:14px}
#selDesc{margin:6px auto 0;max-width:340px;font-size:16px;font-weight:500;color:#9a70b8;line-height:1.25}
#selPick{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:22px;padding:11px 40px;color:#fff;background:linear-gradient(180deg,#ffa9cf,#f37fb4);box-shadow:0 5px 0 #d0609a}
#selPick.chosen{background:linear-gradient(180deg,#9df0d6,#5fc7a6);box-shadow:0 5px 0 #3fa585}
#selPick.dis{pointer-events:none;background:linear-gradient(180deg,#d9cbe6,#bba6cf);box-shadow:0 5px 0 #9c86b3}
#cont{justify-content:center;background:rgba(255,225,240,.35)}
#cont .card{padding:22px 24px 20px;max-width:340px}
#cont h2{font-size:30px;line-height:1.1;margin-bottom:4px}
#cont .lbl{margin-top:2px}
#contScore{font-size:40px;font-weight:700;color:#8b5cc2;line-height:1.1}
#contGo{display:block;margin:14px auto 0;font-size:22px;padding:13px 26px;color:#fff;background:linear-gradient(180deg,#9df0d6,#5fc7a6);box-shadow:0 5px 0 #3fa585;animation:pulse 1.1s ease-in-out infinite}
.cbar{height:6px;border-radius:4px;background:rgba(200,160,220,.35);margin:14px 6px 0;overflow:hidden}
#contBar{height:100%;background:linear-gradient(90deg,#ff9ec7,#b9a1f5);transform-origin:left;transform:scaleX(1)}
#contNo{margin-top:12px;font-size:16px;padding:7px 18px;color:#a080c0}
#contNoAds{margin-top:10px;font-size:14px;padding:6px 14px;color:#fff;background:linear-gradient(90deg,#ffb36b,#ff8fc0);box-shadow:0 3px 0 #d8709a}
#selBuy{display:inline-flex;margin-top:8px;font-size:17px;padding:8px 18px;color:#fff;background:linear-gradient(180deg,#ffd27a,#ffad4d);box-shadow:0 4px 0 #d98a2e}
#selShop{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#selShop .pbtn{font-size:12px;padding:6px 10px}
@media (max-height:760px){#selDesc{font-size:13px;line-height:1.2}#selName{margin-bottom:0}#selShop{gap:5px}#selShop .pbtn{font-size:11.5px;padding:5px 8px}}
#selNoAds{color:#fff;background:linear-gradient(90deg,#ffb36b,#ff8fc0);box-shadow:0 3px 0 #d8709a}
#selNoAds.owned{background:linear-gradient(90deg,#9df0d6,#5fc7a6);box-shadow:0 3px 0 #3fa585}
.mon-ov{position:fixed;inset:0;z-index:50;background:rgba(60,30,80,.55);display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif}
.mon-box{background:#fff;border-radius:22px;padding:22px 22px 18px;min-width:260px;max-width:86vw;text-align:center;color:#6a4b8a;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mon-t{font-weight:700;font-size:19px}.mon-t small{font-weight:500;font-size:12px;color:#b090c0}
.mon-p{margin-top:10px;font-size:16px}.mon-price{font-size:30px;font-weight:700;color:#3fa585;margin-top:4px}
.mon-ad{margin:14px auto 0;width:200px;height:120px;border-radius:14px;background:repeating-linear-gradient(45deg,#ffe0ef,#ffe0ef 12px,#e9e0ff 12px,#e9e0ff 24px);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#c090d0}
.mon-row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.mon-b{font-family:inherit;font-weight:700;font-size:16px;border:none;border-radius:20px;padding:9px 18px;color:#fff;background:#5fc7a6;box-shadow:0 3px 0 #3fa585}
.mon-b.no{background:#cbb8dc;box-shadow:0 3px 0 #a892bf}
.mon-toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;transition:all .3s;z-index:60;background:rgba(255,255,255,.95);color:#7a4fb0;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;padding:10px 16px;border-radius:18px;box-shadow:0 4px 0 rgba(180,120,200,.4);max-width:86vw;text-align:center;pointer-events:none}
.mon-toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div id="hud" style="opacity:0"><div id="score">0</div><div id="combo">Combo x2</div></div>
  <div id="hint"><span id="hintText"></span></div>
  <div id="title" class="screen on">
    <div class="logo"><span class="l">M</span><span class="l">o</span><span class="l">c</span><span class="l">h</span><span class="l">i</span></div>
    <div class="sub">¡Corre, cambia de color y atraviesa!</div>
    <div class="bestline" id="bestTitle" style="display:none"></div>
    <button class="pbtn" id="charBtn"><span class="dot"></span>Personajes</button>
    <div class="tap">Toca para jugar</div>
  </div>
  <div id="over" class="screen">
    <div class="card">
      <h2 id="overTitle">¡Plof!</h2>
      <div class="lbl">Puntos</div>
      <div class="big" id="finalScore">0</div>
      <div class="lbl">Récord</div>
      <div class="rec" id="finalBest">0</div>
      <div class="nr" id="newRec">¡Nuevo récord!</div>
      <div class="unl" id="overUnlock"></div>
      <div><button class="pbtn" id="charBtn2">Personajes</button></div>
      <div><div class="tap">Toca para repetir</div></div>
    </div>
  </div>
  <div id="select" class="screen">
    <div class="top"><button class="pbtn" id="selBack">‹ Volver</button><h3>Personajes</h3><div id="selCount">1/10</div></div>
    <div id="selRecord"></div>
    <button class="pbtn arrow" id="selPrev" aria-label="Anterior">‹</button>
    <button class="pbtn arrow" id="selNext" aria-label="Siguiente">›</button>
    <div id="selInfo"><div id="selName">Mochi</div><div id="selInner"></div><div id="selDesc"></div><button class="pbtn" id="selBuy" style="display:none">Desbloquear por 0,99 €</button></div>
    <div id="selShop" style="display:none"><button class="pbtn" id="selNoAds">Sin anuncios</button><button class="pbtn" id="selRestore">Restaurar compras</button><button class="pbtn" id="selPrivacy" style="display:none">Privacidad</button></div>
    <button class="pbtn" id="selPick">¡Jugar!</button>
  </div>
  <div id="cont" class="screen">
    <div class="card">
      <h2>¿Seguir donde<br>te quedaste?</h2>
      <div class="lbl">Llevas</div>
      <div id="contScore">0</div>
      <button class="pbtn" id="contGo">▶ Ver anuncio y seguir</button>
      <div class="lbl" id="contLeft"></div>
      <div class="cbar"><div id="contBar"></div></div>
      <div><button class="pbtn" id="contNo">No, gracias</button></div>
      <div><button class="pbtn" id="contNoAds">Sin anuncios</button></div>
    </div>
  </div>
  <div id="pause" class="screen"><div class="card"><h2>Pausa</h2><div class="lbl">Toca para seguir</div></div></div>
</div>
<button id="mute" aria-label="Sonido"></button>
<script src="config.js"></script>
<script src="monet.js"></script>
<script src="game.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:' && !(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
