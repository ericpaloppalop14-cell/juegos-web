<style>
#hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5}

.pill{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#7a4b8a;font-weight:700;font-size:15px;padding:5px 15px;border-radius:18px;border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(150,80,150,.18),inset 0 1px 0 #fff}

#nums{position:absolute;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 66px);bottom:calc(env(safe-area-inset-bottom) + 10px);display:none;flex-direction:column;gap:5px;justify-content:center;z-index:6;width:min(17vw,70px)}

#nums button{flex:1 1 0;max-height:68px;min-height:38px;border:none;border-radius:16px;font-family:inherit;font-weight:700;font-size:min(7vw,30px);color:#fff;background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),var(--c);border:1.5px solid rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(90,50,110,.22),0 6px 14px rgba(110,60,130,.2),inset 0 -4px 8px rgba(80,30,90,.14);text-shadow:0 1.5px 2px rgba(80,40,90,.35);cursor:pointer;transition:transform .08s,opacity .2s}
#nums button:active{transform:translateY(2px) scale(.96)}
#nums button.busy{opacity:.3}
#nums button.mine{outline:3px solid #fff;outline-offset:-3px;box-shadow:0 0 0 3px rgba(255,143,184,.6),0 6px 14px rgba(110,60,130,.25)}
#nums.cd button{filter:grayscale(.6) brightness(.95)}
@media (orientation:landscape) and (max-height:540px){#nums.on{display:grid;grid-template-columns:1fr 1fr;top:calc(env(safe-area-inset-top) + 64px);width:min(24vw,128px)}#nums button{min-height:0;max-height:none;font-size:min(5vh,26px)}}
#numCd{position:absolute;left:-8px;bottom:0;width:4px;border-radius:2px;background:#ff6fae;height:0}
#mm{position:absolute;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 64px);width:110px;height:110px;display:none;z-index:5;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(180,120,200,.4))}

#hOut.on{display:block}
#hopB{position:absolute;right:calc(env(safe-area-inset-right) + min(17vw,70px) + 22px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:78px;height:78px;border-radius:50%;border:none;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-family:inherit;color:#fff;z-index:6;background:conic-gradient(rgba(90,60,120,.45) var(--cd,0deg),transparent 0),radial-gradient(110% 90% at 30% 15%,rgba(255,255,255,.6),rgba(255,255,255,0) 50%),linear-gradient(#ffa3c9,#b98cf0);border:2px solid rgba(255,255,255,.8);box-shadow:0 4px 0 rgba(110,50,140,.25),0 10px 22px rgba(120,60,150,.28);touch-action:none}

#hopB.on{display:flex}#hopB:active{transform:scale(.93)}#hopB.cd{filter:saturate(.5)}
@media (orientation:landscape) and (max-height:540px){#hopB{right:calc(env(safe-area-inset-right) + min(24vw,128px) + 20px)}}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);pointer-events:none;display:none;z-index:4}

#joyK{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,240,248,.8));box-shadow:0 3px 8px rgba(150,80,150,.3);transform:translate(-50%,-50%)}

#steerHint.on{display:block}

/* v10: números a la IZQUIERDA (mano izquierda) y joystick fijo ABAJO A LA DERECHA (mano derecha), pequeños y pegados al borde */
#nums{left:calc(env(safe-area-inset-left) + 6px)!important;right:auto!important;width:min(13vw,50px)!important;gap:4px!important;top:calc(env(safe-area-inset-top) + 70px)!important;bottom:calc(env(safe-area-inset-bottom) + 8px)!important}
#nums button{max-height:52px!important;min-height:30px!important;font-size:min(6vw,22px)!important;border-radius:13px!important}
#numCd{left:auto!important;right:-7px}
@media (orientation:landscape) and (max-height:540px){#nums.on{width:min(14vw,92px)!important;top:calc(env(safe-area-inset-top) + 58px)!important}#nums button{font-size:min(4.6vh,20px)!important}}
#mm{left:auto!important;right:calc(env(safe-area-inset-right) + 8px)!important;width:96px!important;height:96px!important}
#hOut,#steerHint{left:60px!important;right:60px!important}
#joy{left:auto!important;top:auto!important;right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:112px!important;height:112px!important;margin:0!important;pointer-events:auto!important;touch-action:none;background:rgba(255,255,255,.16)!important;opacity:.85}
#joy::before{content:'';position:absolute;inset:-26px;border-radius:50%}

#joy.on{opacity:1;background:rgba(255,255,255,.26)!important}
#joyK{width:46px!important;height:46px!important;pointer-events:none}
#hopB{right:calc(env(safe-area-inset-right) + 30px)!important;bottom:calc(env(safe-area-inset-bottom) + 140px)!important;width:60px!important;height:60px!important;font-size:24px!important}

/* v11: modo zurdo, todo en espejo */
body.zurdo #nums{left:auto!important;right:calc(env(safe-area-inset-right) + 6px)!important}
body.zurdo #numCd{right:auto!important;left:-7px!important}
body.zurdo #joy{right:auto!important;left:calc(env(safe-area-inset-left) + 10px)!important}
body.zurdo #hopB{right:auto!important;left:calc(env(safe-area-inset-left) + 30px)!important}
body.zurdo #mm{right:auto!important;left:calc(env(safe-area-inset-left) + 8px)!important}

/* v12: Salto al lado del joystick (hacia el centro), misma altura, estilo kawaii premium */
#hopB{right:calc(env(safe-area-inset-right) + 132px)!important;bottom:calc(env(safe-area-inset-bottom) + 33px)!important;left:auto;width:66px!important;height:66px!important;padding:0;
 background:conic-gradient(from 0deg,rgba(80,40,110,.38) var(--cd,0deg),transparent 0),radial-gradient(90% 70% at 35% 22%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),linear-gradient(160deg,#ffc2dc 0%,#ff9cc6 45%,#c79cf5 100%)!important;
 border:3px solid #fff!important;box-shadow:0 5px 0 #d77fb4,0 10px 20px rgba(150,70,160,.32),inset 0 -5px 10px rgba(140,60,150,.18)!important;opacity:.95;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
#hopB .hring{position:absolute;inset:4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);pointer-events:none}
#hopB .hico{width:30px;height:30px;margin-top:2px;filter:drop-shadow(0 1.5px 1px rgba(130,50,120,.35));pointer-events:none}
#hopB small{font-size:11px!important;margin-top:-3px!important;letter-spacing:.3px;text-shadow:0 1px 2px rgba(130,50,120,.45);pointer-events:none}
#hopB:active,#hopB.press{transform:translateY(3px) scale(.9,.86)!important;box-shadow:0 2px 0 #d77fb4,0 4px 10px rgba(150,70,160,.25),inset 0 -3px 8px rgba(140,60,150,.2)!important}
#hopB.boing .hico{animation:hboing .38s ease-out}
@keyframes hboing{0%{transform:translateY(0)}35%{transform:translateY(-6px) scale(1.08)}70%{transform:translateY(1px) scale(.96)}100%{transform:none}}
#hopB.cd{filter:saturate(.55) brightness(.97)}
body.zurdo #hopB{right:auto!important;left:calc(env(safe-area-inset-left) + 132px)!important}

/* v13 Carrera en las alturas: botón Empujón a la izquierda (a la derecha en modo zurdo) */
#joy.on{display:block}
#pushB{position:absolute;left:calc(env(safe-area-inset-left) + 16px);bottom:calc(env(safe-area-inset-bottom) + 26px);width:84px;height:84px;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;color:#fff;z-index:6;touch-action:none;padding:0;
 background:conic-gradient(from 0deg,rgba(80,40,110,.4) var(--cd,0deg),transparent 0),radial-gradient(90% 70% at 35% 22%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),linear-gradient(160deg,#ffd27a 0%,#ffa36b 50%,#ff7fae 100%);
 border:3px solid #fff;box-shadow:0 5px 0 #e0866a,0 10px 20px rgba(150,70,160,.32),inset 0 -5px 10px rgba(140,60,150,.18);transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
#pushB.on{display:flex}#pushB .hring{position:absolute;inset:4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);pointer-events:none}
#pushB #pushIco{font-size:34px;line-height:1;pointer-events:none;filter:drop-shadow(0 1.5px 1px rgba(130,50,120,.35))}
#pushB small{font-size:11px;font-weight:700;margin-top:0;text-shadow:0 1px 2px rgba(130,50,120,.45);pointer-events:none}
#pushB.press{transform:translateY(3px) scale(.9,.86)}#pushB.cd{filter:saturate(.5) brightness(.97)}
#pushB.big{animation:pulse .6s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,80,110,.6),0 5px 0 #e0866a,0 10px 24px rgba(255,60,100,.45)}
body.zurdo #pushB{left:auto;right:calc(env(safe-area-inset-right) + 16px)}
#hud .pill{font-size:14px}
</style>
