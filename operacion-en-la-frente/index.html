<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<title>Operación en la frente</title><link rel="manifest" href="manifest.json"><meta property="og:title" content="Operación en la frente"><meta property="og:site_name" content="Operación en la frente"><meta name="application-name" content="Operación en la frente"><meta name="apple-mobile-web-app-title" content="Operación en la frente">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="js/style.css?v=v1">
<style>
#hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5}
#hud.on{display:flex}
.pill{background:rgba(255,255,255,.88);color:#8a5aa8;font-weight:700;font-size:16px;padding:4px 14px;border-radius:16px;box-shadow:0 3px 0 rgba(190,130,200,.35)}
.pill.lv{background:linear-gradient(90deg,#ff9ec7,#b9a1f5);color:#fff;font-size:18px}
#pad{position:absolute;left:0;right:0;bottom:0;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);display:none;flex-direction:column;align-items:center;gap:6px;z-index:5;background:linear-gradient(180deg,rgba(240,248,255,0),rgba(236,244,255,.85) 30%)}
#pad.on{display:flex}
#disp{width:min(98vw,460px);height:54px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#8b5cc2;box-shadow:inset 0 2px 0 rgba(180,120,200,.25);position:relative;overflow:hidden}
#disp .ph{font-size:17px;color:#c4a8dc}
#disp.bad{animation:shake .3s;background:#ffd6e4}
#disp.lock::after{content:'⏳ Bloqueado';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,200,220,.92);color:#d43c7c;font-size:22px}
#disp i{position:absolute;left:0;bottom:0;height:5px;background:#f06aa8;width:0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(98vw,460px)}
#keys button{height:48px;border:none;border-radius:16px;font-family:inherit;font-weight:700;font-size:25px;color:#8b5cc2;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(180,120,200,.45);cursor:pointer}
#keys button.ok{color:#fff;background:linear-gradient(180deg,#8fecd0,#4fcaa4);box-shadow:0 3px 0 #2f9f7f}
#keys button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(180,120,200,.45)}
#pad.locked #keys button{opacity:.45}
#spect{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);text-align:center;display:none;z-index:5;pointer-events:none}
#spect.on{display:block}
@media (orientation:landscape) and (min-width:700px){
 #pad{left:auto;top:0;width:min(330px,34vw);justify-content:center;padding:10px 14px;background:linear-gradient(90deg,rgba(240,248,255,0),rgba(236,244,255,.8) 25%)}
 #disp{width:100%}#keys{grid-template-columns:repeat(3,1fr);width:100%}#keys button{height:56px}}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="hud"><div class="pill lv" id="hLv"></div><div class="pill" id="hAlive"></div></div>
<div id="spect"><span class="pill">👻 Te han resuelto · mirando la partida</span></div>
<div id="pad"><div id="disp"><span class="ph">Escribe un resultado</span><i></i></div><div id="keys"></div></div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script src="lib/peerjs.min.js"></script><script src="online-config.js?v=1"></script><script src="online-cf.js?v=1" data-peer-game="operacion-en-la-frente"></script>
<script>if (/localnet/.test(location.search)) document.write('<script src="lib/fakepeer.js"><\/script>');</script>
<script type="module" src="js/main.js?v=v1"></script>
</body>
</html>
